<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>AdsPulse admin demo</title><style>body{background:#10151d;color:#8d98aa;font:14px system-ui,sans-serif;padding:40px}</style></head><body>Loading admin demo…
<script>
const ADMIN_JS = "const ADMIN = (function () {\n  let s = 99; const r = (a, b) => { s = (s * 16807) % 2147483647; return a + ((s - 1) / 2147483646) * (b - a); };\n  const day = d => new Date(Date.now() - d * 864e5);\n  const fmtD = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });\n  const clients = [\n    ['Demo brand (aligners)', 'Pilot', true, true, 'Healthy'], ['Glow Skin Co.', 'Pilot', true, false, 'Healthy'], ['UrbanFit Gyms', 'Pilot', true, true, 'Token expires soon'],\n    ['Kraft Home Decor', 'Onboarding', false, false, 'Not connected'], ['Spice Route Foods', 'Pilot', true, false, 'Sync error'], ['Agency: Bluefin Media', 'Pilot', true, true, 'Healthy']\n  ].map(([n, plan, m, g, st]) => ({ n, plan, m, g, st, accts: n.startsWith('Agency') ? 4 : (m ? 1 : 0) + (g ? 1 : 0), spend: m || g ? r(1.5e5, 2.4e6) : 0, alerts: m || g ? Math.round(r(2, 24)) : 0, last: m || g ? day(r(0, 1.2)) : null }));\n  const leads = [\n    ['Riya Mehta', 'Pastel Bakes', 'Meta', '₹50k–2L', 'New'], ['Aman Gupta', 'Gupta Motors', 'Both', '₹2L–10L', 'Call booked'], ['Sara Thomas', 'Thread & Co.', 'Meta', 'Under ₹50k', 'New'],\n    ['Vikram Rao', 'Rao Realty', 'Google', '₹2L–10L', 'Connected'], ['Neha Kapoor', 'Kapoor Clinics', 'Both', '₹10L+', 'Call booked'], ['Imran Shaikh', 'Shaikh Travels', 'Meta', '₹50k–2L', 'Not a fit']\n  ].map(([n, c, p, sp, st], i) => ({ n, c, p, sp, st, at: day(i * 1.7 + r(0, 1)) }));\n  return { clients, leads, fmtD };\n})();\nV.admin = { t: 'Admin', s: 'Owner view: every client workspace, connection health and pilot signups. Clients never see this page. All names here are sample data.', async r() {\n  const c = ADMIN.clients, l = ADMIN.leads, fmt = v => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(v);\n  const liveC = c.filter(x => x.m || x.g);\n  const stK = { Healthy: 'good', 'Token expires soon': 'warn', 'Sync error': 'bad', 'Not connected': 'mute' };\n  const ldK = { New: 'info', 'Call booked': 'warn', Connected: 'good', 'Not a fit': 'mute' };\n  const f = tab('lf', 'all');\n  const tick = b => b ? '<span class=\"up\">✓</span>' : '<span class=\"fl\">–</span>';\n  return { html: `<div class=\"grid g4\">${kpi('Client workspaces', c.length, `${liveC.length} connected`)}${kpi('Ad accounts synced', sum(c, x => x.accts))}${kpi('Ad spend monitored (30d)', fmt(sum(c, x => x.spend)))}${kpi('Pilot requests', l.length, `${l.filter(x => x.st === 'New').length} waiting for a reply`)}</div>\n   <div class=\"mt\">${card('Clients', 'Connection health is checked on every sync. Expiring Meta tokens need the client to reconnect.', table([\n     { h: 'Client', l: 1, f: x => esc(x.n) }, { h: 'Plan', l: 1, f: x => esc(x.plan) }, { h: 'Meta', f: x => tick(x.m) }, { h: 'Google', f: x => tick(x.g) }, { h: 'Ad accounts', f: x => x.accts },\n     { h: 'Spend (30d)', f: x => x.spend ? fmt(x.spend) : '–' }, { h: 'Open alerts', f: x => x.alerts || '–' }, { h: 'Last sync', f: x => x.last ? ADMIN.fmtD(x.last) : '–' }, { h: 'Health', f: x => pill(stK[x.st], x.st) }], c))}</div>\n   <div class=\"mt\">${card('Pilot requests', 'Everyone who asked for pilot access on the website. In the live version this reads from your signup form.',\n     tabs('lf', [['all', 'All'], ['New', 'New'], ['Call booked', 'Call booked'], ['Connected', 'Connected']], 'all') +\n     table([{ h: 'Name', l: 1, f: x => esc(x.n) }, { h: 'Company', l: 1, f: x => esc(x.c) }, { h: 'Platforms', l: 1, f: x => esc(x.p) }, { h: 'Monthly spend', l: 1, f: x => esc(x.sp) }, { h: 'Received', f: x => ADMIN.fmtD(x.at) }, { h: 'Stage', f: x => pill(ldK[x.st], x.st) }], l.filter(x => f === 'all' || x.st === f)))}</div>\n   <div class=\"grid g2 mt\">${card('Next actions', '', `<div class=\"list\">\n     <div class=\"item sev-bad\"><div class=\"h\"><span>Spice Route Foods: sync error</span></div><div class=\"m\">Meta permissions were removed. Ask them to reconnect from Connections.</div></div>\n     <div class=\"item sev-warn\"><div class=\"h\"><span>UrbanFit Gyms: Meta token expires in 6 days</span></div><div class=\"m\">Send a reconnect reminder.</div></div>\n     <div class=\"item sev-good\"><div class=\"h\"><span>${l.filter(x => x.st === 'New').length} new pilot requests</span></div><div class=\"m\">Reply and book a 15-minute call.</div></div></div>`)}\n     ${card('Platform access', 'What still blocks outside clients from connecting.', `<div class=\"list\">\n     <div class=\"item sev-warn\"><div class=\"h\"><span>Meta: development mode</span></div><div class=\"m\">Pilots must be added as app Testers until Business Verification and App Review pass.</div></div>\n     <div class=\"item sev-warn\"><div class=\"h\"><span>Google Ads: developer token access</span></div><div class=\"m\">Needs Explorer or Basic access to read real client accounts.</div></div></div>`)}</div>` };\n} };\n";
fetch('app.html', {cache: 'no-store'}).then(r => r.text()).then(h => {
  h = h.replace('<a class="nav-a" href="#connections">Connections</a>', '<a class="nav-a" href="#connections">Connections</a>\n    <div class="grp">Owner</div>\n    <a class="nav-a" href="#admin">Admin</a>');
  if (!h.includes('const ADMIN')) h = h.replace('/* ---------- charts ---------- */', ADMIN_JS + '\n/* ---------- charts ---------- */');
  h = h.replace('<title>AdsPulse demo: see the product with sample data</title>', '<title>AdsPulse admin demo</title><meta name="robots" content="noindex">');
  if (!location.hash) history.replaceState(null, '', '#admin');
  document.open(); document.write(h); document.close();
}).catch(e => { document.body.textContent = 'Could not load the demo: ' + e.message; });
</script></body></html>
